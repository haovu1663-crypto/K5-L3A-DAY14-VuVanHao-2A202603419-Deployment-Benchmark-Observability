# ============================================================
# Render Blueprint — agent + Redis (Key Value)
#
# File nằm trong thư mục con, nên khi tạo Blueprint trên Render hãy chỉ đường dẫn
# "Blueprint file path" là:  06-lab-complete/render.yaml
# Các đường dẫn dockerfilePath / dockerContext bên dưới tính từ GỐC repo.
#
# KHÔNG ghi secret thật ở đây: AGENT_API_KEY do Render tự sinh (generateValue).
# ============================================================
services:
  - type: web
    name: ai-agent
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh chuỗi ngẫu nhiên, xem trong dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  # Redis của Render (tên sản phẩm hiện tại là "Key Value")
  - type: keyvalue
    name: agent-redis
    region: singapore
    plan: free
    ipAllowList: []                  # [] = chỉ các service trong cùng account kết nối được
