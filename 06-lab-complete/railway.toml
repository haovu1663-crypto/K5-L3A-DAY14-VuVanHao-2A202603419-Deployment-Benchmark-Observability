# ============================================================
# Railway — chạy:  cd 06-lab-complete && railway up
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên Railway, KHÔNG ghi ở đây.
# App lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile).
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
