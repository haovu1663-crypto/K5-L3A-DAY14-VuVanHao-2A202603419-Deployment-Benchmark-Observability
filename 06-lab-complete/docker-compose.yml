# ============================================================
# agent + redis, chạy bằng một lệnh:  docker compose up --build
#
#   cp .env.example .env     # rồi điền AGENT_API_KEY
#   curl http://localhost:8000/health
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    # Đọc thêm biến từ .env; không có file .env vẫn chạy được (required: false)
    env_file:
      - path: .env
        required: false
    environment:
      # Ghi đè .env: trong compose, Redis là service "redis", không phải localhost
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
